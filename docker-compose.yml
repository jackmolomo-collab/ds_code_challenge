services:

  dagster:
    build:
      context: .

    ports:
      - "3000:3000"

    volumes:
      - ./dagster_project:/opt/dagster/dagster_project
      - ./src:/opt/dagster/src
      - ./config:/opt/dagster/config
      - ./output:/opt/dagster/output
      - ./dagster_home:/opt/dagster/dagster_home